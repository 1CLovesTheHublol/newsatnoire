<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essays — News At Noire</title>
<meta name="description" content="Essays from News At Noire: long-form argument and reflection on Black political thought, history, and culture.">
<link rel="canonical" href="https://www.newsatnoire.com/essays.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="News At Noire">
<meta property="og:title" content="Essays — News At Noire">
<meta property="og:description" content="Long-form argument and reflection on Black political thought, history, and culture.">
<meta property="og:url" content="https://www.newsatnoire.com/essays.html">
<meta property="og:image" content="https://www.newsatnoire.com/news-at-noire-og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/noire-shell.css">
<style>
  :root{--cream:#F4F1EA;--cream-2:#EDE8DC;--ink:#1A1A1A;--maroon:#6E1423;--maroon-2:#8A1E2F;--muted:#6b6256;
    --display:'Libre Caslon Display',Georgia,serif;--text:'Libre Caslon Text',Georgia,serif;--serif:'Source Serif 4',Georgia,serif;--sans:'Helvetica Neue',Arial,Helvetica,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  main{flex:1}
  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,3vw,24px)}
  .mast{text-align:center;padding:56px 0 26px;border-bottom:1px solid var(--ink)}
  .kicker{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--maroon);margin-bottom:16px}
  .mast h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,7vw,76px);line-height:1}
  .mast .rule{height:7px;max-width:420px;margin:20px auto 16px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}
  .mast p{font-style:italic;font-size:clamp(18px,2.3vw,22px);color:#3a352d;max-width:56ch;margin:0 auto}
  .filters{display:flex;flex-wrap:wrap;gap:8px;padding:18px 0;border-bottom:1px solid rgba(26,26,26,.2)}
  .filters button{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);padding:0 14px;min-height:38px;border:1px solid rgba(26,26,26,.35);background:none;cursor:pointer}
  .filters button:hover{border-color:var(--maroon);color:var(--maroon)}
  .filters button[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:var(--cream)}
  .list{padding:8px 0 56px}
  .item{display:grid;grid-template-columns:150px minmax(0,1fr) 180px;gap:8px 30px;padding:24px 0;border-bottom:1px solid rgba(26,26,26,.2);align-items:baseline}
  .item .cat{font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--maroon)}
  .item h2{font-family:var(--text);font-weight:400;font-size:clamp(23px,2.6vw,29px);line-height:1.18;text-wrap:balance}
  .item:hover h2{color:var(--maroon)}
  .item p{font-size:17px;line-height:1.5;color:#3a352d;margin-top:8px}
  .item .by{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.6}
  .item .by b{color:var(--ink);display:block}
  .state{padding:80px 0;text-align:center;font-style:italic;font-size:20px;color:var(--muted)}
  .desk{background:var(--cream-2);border-top:1px solid var(--ink)}
  .desk .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-top:26px;padding-bottom:26px}
  .desk p{font-family:var(--text);font-size:20px}
  .desk a{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--ink);padding:0 20px;min-height:44px;display:inline-flex;align-items:center}
  .desk a:hover{background:var(--ink);color:var(--cream)}
  @media(max-width:760px){.item{grid-template-columns:minmax(0,1fr)}.item .by{text-align:left}.item .by b{display:inline;margin-right:8px}}
</style>
</head>
<body>
  <div data-nn-header></div>
  <script src="assets/noire-shell.js"></script>
  <main>
    <section class="wrap mast">
      <span class="kicker">The Journal</span>
      <h1>Essays</h1>
      <div class="rule"></div>
      <p>Long-form argument and reflection on Black political thought, history, and culture.</p>
    </section>
    <div class="wrap">
      <div class="filters" id="filters" role="group" aria-label="Filter by section" hidden></div>
      <div class="list" id="list"><p class="state">Loading essays…</p></div>
    </div>
  </main>
  <section class="desk"><div class="wrap"><p>Contributors with an invitation can write here.</p><a href="write.html">Writers' Desk →</a></div></section>
  <div data-nn-footer></div>
<script>
(function () {
  var list = document.getElementById('list'), filters = document.getElementById('filters'), all = [], cur = 'All';
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function date(d) { var x = new Date(d); return isNaN(x) ? '' : x.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); }
  function render() {
    var items = all.filter(function (e) { return cur === 'All' || e.category === cur; });
    list.innerHTML = items.length ? items.map(function (e) {
      return '<a class="item" href="essay.html?e=' + encodeURIComponent(e.slug) + '"><span class="cat">' + esc(e.category) + '</span><div><h2>' + esc(e.title) + '</h2>' + (e.summary ? '<p>' + esc(e.summary) + '</p>' : '') + '</div><span class="by"><b>' + esc(e.author || 'The Editors') + '</b>' + date(e.date) + '</span></a>';
    }).join('') : '<p class="state">The first essays are on their way.</p>';
  }
  fetch(window.NOIRE_API + '/essays').then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
    all = Array.isArray(d) ? d : [];
    var cats = ['All'].concat(all.map(function (e) { return e.category; }).filter(function (c, i, a) { return c && a.indexOf(c) === i; }));
    if (cats.length > 2) {
      filters.hidden = false;
      filters.innerHTML = cats.map(function (c) { return '<button type="button" aria-pressed="' + (c === cur) + '">' + esc(c) + '</button>'; }).join('');
      filters.querySelectorAll('button').forEach(function (b) { b.onclick = function () { cur = b.textContent; filters.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); render(); }; });
    }
    render();
  }).catch(function () { list.innerHTML = '<p class="state">Essays couldn\u2019t be loaded just now. Please try again shortly.</p>'; });
})();
</script>
</body>
</html>
